<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 520px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0e1117;
      color: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      gap: 8px;
    }

    /* ── Camera area ───────────────────────────────────────────── */
    .scanner-wrap {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: #1a1f2e;
      border-radius: 12px;
      overflow: hidden;
      min-height: 280px;
    }
    #video {
      width: 100%;
      display: block;
      /* Critical for iOS: */
      -webkit-playsinline: true;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #placeholder {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 13px;
    }

    /* ── Result ────────────────────────────────────────────────── */
    #result-wrap { width: 100%; max-width: 440px; display: none; }
    #result-code {
      font-family: 'Courier New', monospace;
      font-size: 20px;
      font-weight: bold;
      background: #1a472a;
      color: #69db7c;
      border: 2px solid #2d6a4f;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      word-break: break-all;
    }
    #result-type {
      font-size: 11px;
      color: #5a8a6a;
      text-align: center;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Buttons ───────────────────────────────────────────────── */
    .btn {
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 440px;
    }
    #btn-start { background: #ff4b4b; color: #fff; }
    #btn-stop  { background: #444;    color: #fff; display: none; }

    /* ── Info ──────────────────────────────────────────────────── */
    #status { font-size: 13px; color: #aaa; text-align: center; max-width: 440px; min-height: 18px; }
    #debug  { font-size: 10px; color: #555; text-align: center; max-width: 440px; word-break: break-all; min-height: 14px; }
    #mode   { font-size: 10px; color: #334; background: #111926; border-radius: 4px; padding: 2px 8px; }
  </style>
</head>
<body>

  <div class="scanner-wrap" id="scanner-wrap">
    <div id="placeholder">Cámara inactiva</div>
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="result-wrap">
    <div id="result-code">—</div>
    <div id="result-type">—</div>
  </div>

  <button class="btn" id="btn-start" onclick="startScanner()">Iniciar Scanner</button>
  <button class="btn" id="btn-stop"  onclick="stopScanner()">Detener Scanner</button>

  <div id="mode"></div>
  <div id="status">Listo</div>
  <div id="debug"></div>

  <script>
    // ── Streamlit communication ────────────────────────────────────────────────
    window.addEventListener("load", function () {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*"
      );
      // Report height after DOM renders
      setTimeout(doSendHeight, 200);
    });
    window.addEventListener("message", function (e) {
      if (e.data && e.data.type === "streamlit:render") setTimeout(doSendHeight, 100);
    });
    function sendValue(v) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: v, dataType: "json" }, "*"
      );
    }
    function doSendHeight() {
      var h = Math.max(document.body.scrollHeight, 520);
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*"
      );
    }

    // ── Audio ──────────────────────────────────────────────────────────────────
    var audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function beepSuccess() {
      try {
        var ctx = getAudio();
        [880, 1320].forEach(function (hz, i) {
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = "sine"; o.frequency.value = hz;
          var t = ctx.currentTime + i * 0.12;
          g.gain.setValueAtTime(0.35, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.10);
          o.start(t); o.stop(t + 0.10);
        });
      } catch (e) {}
    }
    function beepError() {
      try {
        var ctx = getAudio();
        [300, 200].forEach(function (hz, i) {
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = "sawtooth"; o.frequency.value = hz;
          var t = ctx.currentTime + i * 0.18;
          g.gain.setValueAtTime(0.25, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          o.start(t); o.stop(t + 0.15);
        });
      } catch (e) {}
    }

    // ── State ──────────────────────────────────────────────────────────────────
    var useNative    = ('BarcodeDetector' in window);
    var detector     = null;
    var codeReader   = null;
    var scanControls = null;
    var videoStream  = null;
    var scanning     = false;
    var lastSent     = {};
    var clearTimer   = null;
    var COOLDOWN     = 3000;

    function setStatus(msg) { document.getElementById("status").textContent = msg; }
    function setDebug(msg)  { document.getElementById("debug").textContent  = msg; }
    function setMode(msg)   { document.getElementById("mode").textContent   = msg; }

    // ── Start ──────────────────────────────────────────────────────────────────
    function startScanner() {
      document.getElementById("btn-start").style.display   = "none";
      document.getElementById("btn-stop").style.display    = "block";
      document.getElementById("placeholder").style.display = "none";
      setStatus("Solicitando cámara...");

      var video = document.getElementById("video");
      // Set all autoplay attributes programmatically (iOS + Chrome requirement)
      video.muted      = true;
      video.autoplay   = true;
      video.playsInline = true;
      video.setAttribute("muted",      "");
      video.setAttribute("autoplay",   "");
      video.setAttribute("playsinline","");

      var constraints = {
        video: {
          facingMode: { ideal: "environment" },
          width:  { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(function (stream) {
          videoStream  = stream;
          video.srcObject = stream;
          setStatus("Activando cámara...");
          setDebug("stream OK — tracks: " + stream.getVideoTracks().length);

          // play() must be called; handle both success and failure
          var p = video.play();
          if (p && typeof p.then === "function") {
            p.then(function () {
              setDebug("play() OK — videoWidth: " + video.videoWidth);
              waitForVideo(video);
            }).catch(function (e) {
              // play() blocked — add tap-to-play fallback
              setStatus("Toca la imagen para iniciar el video");
              setDebug("play() blocked: " + e.name);
              document.getElementById("scanner-wrap").style.cursor = "pointer";
              document.getElementById("scanner-wrap").onclick = function () {
                video.play().then(function () { waitForVideo(video); });
                document.getElementById("scanner-wrap").onclick = null;
                document.getElementById("scanner-wrap").style.cursor = "";
              };
            });
          } else {
            // Older browsers where play() is synchronous
            waitForVideo(video);
          }
        })
        .catch(function (err) {
          beepError();
          setStatus("Error al acceder a cámara: " + err.name);
          setDebug(err.message);
          resetButtons();
          doSendHeight();
        });
    }

    // Wait until video has real dimensions before starting detector
    function waitForVideo(video) {
      if (video.videoWidth > 0 && video.videoHeight > 0) {
        setStatus("Cámara lista — iniciando detector...");
        setDebug("resolución: " + video.videoWidth + "×" + video.videoHeight);
        doSendHeight();
        if (useNative) startNative(video); else startZXing(video);
      } else {
        // Retry until frame data is available
        setTimeout(function () { waitForVideo(video); }, 100);
      }
    }

    // ── BarcodeDetector (Android Chrome — multi-code) ──────────────────────────
    function startNative(video) {
      var ALL = ["qr_code","ean_13","ean_8","code_128","code_39",
                 "upc_a","upc_e","itf","data_matrix","pdf_417","aztec","codabar"];

      BarcodeDetector.getSupportedFormats()
        .then(function (supported) {
          var fmts = ALL.filter(function (f) { return supported.includes(f); });
          setDebug("BarcodeDetector OK — formatos: " + fmts.length);
          detector  = new BarcodeDetector({ formats: fmts });
          scanning  = true;
          setMode("Multi-código (BarcodeDetector nativo)");
          setStatus("Escaneando — apunta al/los código(s)");
          doSendHeight();
          requestAnimationFrame(function () { nativeLoop(video); });
        })
        .catch(function (e) {
          setDebug("BarcodeDetector.getSupportedFormats() falló: " + e);
          useNative = false;
          startZXing(video);
        });
    }

    function nativeLoop(video) {
      if (!scanning) return;
      if (video.readyState < 2) { requestAnimationFrame(function () { nativeLoop(video); }); return; }

      detector.detect(video)
        .then(function (barcodes) {
          var overlay = document.getElementById("overlay");
          var ctx     = overlay.getContext("2d");
          var dW = video.clientWidth,  dH = video.clientHeight;
          var vW = video.videoWidth,   vH = video.videoHeight;
          overlay.width = dW; overlay.height = dH;
          ctx.clearRect(0, 0, dW, dH);

          if (barcodes.length > 0) {
            var sx = dW / vW, sy = dH / vH;
            var detected = barcodes.map(function (b) {
              var corners = b.cornerPoints.map(function (p) {
                return { x: p.x * sx, y: p.y * sy };
              });
              drawPolygon(ctx, corners, b.rawValue);
              return { code: b.rawValue, type: b.format.toUpperCase() };
            });
            onDetectedBatch(detected);

            clearTimeout(clearTimer);
            clearTimer = setTimeout(function () { ctx.clearRect(0, 0, dW, dH); }, 1500);
          }
        })
        .catch(function () {})
        .finally(function () {
          if (scanning) requestAnimationFrame(function () { nativeLoop(video); });
        });
    }

    // ── ZXing fallback (iOS / Firefox — single code) ──────────────────────────
    function startZXing(video) {
      if (typeof ZXing === "undefined") {
        setStatus("Error: ZXing no cargó. Verifica tu conexión e intenta de nuevo.");
        resetButtons(); doSendHeight(); return;
      }

      var hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.QR_CODE,    ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,      ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,    ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E,      ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.PDF_417,
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      codeReader = new ZXing.BrowserMultiFormatReader(hints, 300);

      setMode("Un código a la vez (ZXing — iOS/Firefox)");
      setStatus("Escaneando — apunta al código");
      setDebug("ZXing listo");
      doSendHeight();

      codeReader.decodeFromStream(videoStream, video, function (result, error) {
        if (!result) return;
        var text = result.getText();
        var fmt  = ZXing.BarcodeFormat[result.getBarcodeFormat()] || "UNKNOWN";
        var pts  = result.getResultPoints();
        var vW   = video.videoWidth,  vH = video.videoHeight;
        var dW   = video.clientWidth, dH = video.clientHeight;
        var overlay = document.getElementById("overlay");
        var ctx     = overlay.getContext("2d");
        overlay.width = dW; overlay.height = dH;
        ctx.clearRect(0, 0, dW, dH);

        if (pts && pts.length > 0) {
          var sx = dW / vW, sy = dH / vH;
          var corners = pts.map(function (p) {
            return { x: p.getX() * sx, y: p.getY() * sy };
          });
          drawPolygon(ctx, corners, text);
        }

        onDetectedBatch([{ code: text, type: fmt }]);
        clearTimeout(clearTimer);
        clearTimer = setTimeout(function () { ctx.clearRect(0, 0, dW, dH); }, 1500);
      })
      .then(function (ctrl) { scanControls = ctrl; scanning = true; })
      .catch(function (e) {
        beepError();
        setStatus("Error ZXing: " + (e.message || e));
        resetButtons(); doSendHeight();
      });
    }

    // ── Process a batch of detected codes ──────────────────────────────────────
    function onDetectedBatch(codes) {
      var now    = Date.now();
      var toSend = codes.filter(function (item) {
        var prev = lastSent[item.code] || 0;
        if (now - prev < COOLDOWN) return false;
        lastSent[item.code] = now;
        return true;
      });
      if (toSend.length === 0) return;

      document.getElementById("result-wrap").style.display = "block";
      document.getElementById("result-code").textContent   =
        toSend.map(function (i) { return i.code; }).join("  |  ");
      document.getElementById("result-type").textContent   =
        toSend.map(function (i) { return i.type; }).join("  ·  ");

      beepSuccess();
      setDebug("→ " + toSend.map(function (i) { return i.code; }).join(", "));
      sendValue({ codes: toSend, scan_id: now });
      doSendHeight();
    }

    // ── Draw polygon bounding box with code label ──────────────────────────────
    function drawPolygon(ctx, corners, label) {
      if (!corners || corners.length < 2) return;

      var xs = corners.map(function (p) { return p.x; });
      var ys = corners.map(function (p) { return p.y; });

      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (var i = 1; i < corners.length; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();
      ctx.fillStyle   = "rgba(0,255,136,0.10)";
      ctx.fill();
      ctx.strokeStyle = "#00ff88";
      ctx.lineWidth   = 2.5;
      ctx.stroke();

      // Corner L-brackets
      var c = 14;
      ctx.lineWidth = 4;
      corners.forEach(function (pt, idx) {
        var nx = corners[(idx + 1) % corners.length];
        var px = corners[(idx - 1 + corners.length) % corners.length];
        var d1 = Math.hypot(px.x - pt.x, px.y - pt.y) || 1;
        var d2 = Math.hypot(nx.x - pt.x, nx.y - pt.y) || 1;
        ctx.beginPath();
        ctx.moveTo(pt.x + (px.x - pt.x) / d1 * c, pt.y + (px.y - pt.y) / d1 * c);
        ctx.lineTo(pt.x, pt.y);
        ctx.lineTo(pt.x + (nx.x - pt.x) / d2 * c, pt.y + (nx.y - pt.y) / d2 * c);
        ctx.stroke();
      });

      // Label
      if (label) {
        ctx.font = "bold 12px 'Courier New', monospace";
        var tw  = ctx.measureText(label).width;
        var lx  = Math.max(Math.min.apply(null, xs), 2);
        var ly  = Math.max(Math.min.apply(null, ys) - 6, 18);
        ctx.fillStyle = "rgba(0,20,0,0.80)";
        ctx.fillRect(lx - 2, ly - 14, tw + 8, 17);
        ctx.fillStyle = "#00ff88";
        ctx.fillText(label, lx + 2, ly);
      }
    }

    // ── Stop ───────────────────────────────────────────────────────────────────
    function stopScanner() {
      scanning = false;
      if (scanControls) { try { scanControls.stop(); } catch (e) {} scanControls = null; }
      if (codeReader)   { try { codeReader.reset();  } catch (e) {} codeReader   = null; }
      if (videoStream)  {
        videoStream.getTracks().forEach(function (t) { t.stop(); });
        videoStream = null;
      }
      var video = document.getElementById("video");
      video.srcObject = null;
      document.getElementById("placeholder").style.display = "flex";
      document.getElementById("result-wrap").style.display = "none";
      var ov = document.getElementById("overlay");
      ov.getContext("2d").clearRect(0, 0, ov.width, ov.height);
      resetButtons();
      setStatus("Scanner detenido"); setDebug(""); setMode("");
      doSendHeight();
    }

    function resetButtons() {
      document.getElementById("btn-start").style.display = "block";
      document.getElementById("btn-stop").style.display  = "none";
    }
  </script>
</body>
</html>
